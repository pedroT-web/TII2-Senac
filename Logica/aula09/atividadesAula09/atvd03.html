<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades Nível 3</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <label class="form-label">Digite o nome do cliente</label>
        <input class="form-control w-50" id="inputNomeCliente" type="text" placeholder="Digite o nome do cliente">
        <button type="button" class="btn-solid theme-primary" id="botaoChamarFila" onclick="fnEntrarFila()">Entrar na
            Fila</button>
        <button type="button" class="btn-solid theme-accent" id="botaoAtendido" onclick="fnChamarFila()">Chamar
            Próximo</button>
    </div>

    <div class="grid text-center">
        <div class="container col-6">
            <h5>Clientes Atendidos</h5>
            <div class="grid text-center mt-5" id="containerClientesAtendidos">
            </div>
        </div>

        <div class="container col-6">
            <h5>Clientes Na fila</h5>
            <div class="grid text-center mt-5" id="containerClientesFila">
            </div>
        </div>
    </div>



    <script src="./nivel03.js"></script>
</body>

</html>
