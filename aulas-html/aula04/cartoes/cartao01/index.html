<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container_principal">
        <div class="container">
            <img class="destaque" src="./images/ps5.jpg" alt="Imagem de uma bmw m3 vermelha estacionada">
            <h1 class="titulo">PS5 - Pro</h1>
            <h5 class="valor">R$ 4200,00 </h5>
            <button class="botao">Adicionar ao Carrinho</button>
        </div>
        <div class="container">
            <img class="destaque" src="./images/seriex" alt="Imagem de uma bmw m3 vermelha estacionada">
            <h1 class="titulo">Xbox Serie X</h1>
            <h5 class="valor">R$ 6999,00 </h5>
            <button class="botao">Adicionar ao Carrinho</button>
        </div>
        <div class="container">
            <img class="destaque" src="./images/gta6" alt="Imagem de uma bmw m3 vermelha estacionada">
            <h1 class="titulo">GTA 6</h1>
            <h5 class="valor">R$ 499,99 </h5>
            <button class="botao">Adicionar ao Carrinho</button>
        </div>
    </div>
</body>

</html>
